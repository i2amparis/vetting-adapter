[project]
name = "vetting-adapter"
version = "0.1.0"
description = "Project-agnostic vetting/assessment checks for IAMC-format model results"
authors = [
    { name = "Jan Ivar Korsbakken", email = "janko@cicero.oslo.no" },
    { name = "George Xexakis" }
]
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "pyam-iamc>=2.1",
    "pathways-ensemble-analysis @ git+https://gitlab.com/climateanalytics/pathways-ensemble-analysis.git@v1.1.0",
    # Dependency required by p-e-a (but not listed among its requirements)
    "pandas-indexing>=0.5.1",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
    "pyyaml>=6.0",
    # Required by pandas.io.formats.style (used for styled output tables)
    "jinja2>=3.1",
    "nomenclature-adapter @ git+https://github.com/i2amparis/nomenclature-adapter.git@main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ipython>=8.20.0",
    "pytest>=8.0.0",
    "ipykernel>=6.29.0",
    "dvc[ssh]>=3.48.4",
    "pytest-cov>=5.0.0",
    "notebook>=7.2.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vetting_adapter"]
